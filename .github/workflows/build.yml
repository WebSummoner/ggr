name: build

on:
  push:
    branches:
      - master
  # Only a manual run publishes :latest; releases publish the version tags.
  workflow_dispatch:

jobs:
  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: ~1.27.0

      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Test
        run: ci/test.sh

      - name: Build
        run: ci/build.sh

      - name: Latest image
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ci/docker-push.sh latest

